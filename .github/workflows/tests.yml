name: Tests

on:
  push:
    branches: [fiabilisation]
  pull_request:
    branches: [fiabilisation]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Dossier de données isolé : les tests n'utilisent jamais le vrai dossier Pharmacie2Data
      - name: Isoler le dossier de données des tests
        shell: pwsh
        run: echo "PHARMACIE2_DATA_DIR=$env:RUNNER_TEMP\pharmacie2-tests" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/Pharmacie2.Tests/Pharmacie2.Tests.csproj
      - run: dotnet build tests/Pharmacie2.Tests/Pharmacie2.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/Pharmacie2.Tests/Pharmacie2.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=resultats.trx" --results-directory "${{ github.workspace }}/resultats"
      # Remonte les echecs en annotations (lisibles sans telecharger les logs)
      - name: Annotations des echecs
        if: failure()
        shell: pwsh
        run: |
          $f = Get-ChildItem "${{ github.workspace }}/resultats" -Filter *.trx -Recurse | Select-Object -First 1
          if ($f) {
            [xml]$x = Get-Content $f.FullName
            $ns = New-Object Xml.XmlNamespaceManager($x.NameTable); $ns.AddNamespace('t','http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            foreach ($r in $x.SelectNodes("//t:UnitTestResult[@outcome='Failed']", $ns)) {
              $m = ($r.Output.ErrorInfo.Message + " | " + $r.Output.ErrorInfo.StackTrace) -replace "\s+"," "
              if ($m.Length -gt 900) { $m = $m.Substring(0,900) }
              Write-Output "::error title=$($r.testName)::$m"
            }
          }
