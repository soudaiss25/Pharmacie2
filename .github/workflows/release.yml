name: Publication (Velopack)

# Déclenché UNIQUEMENT par un tag de version :
#   vX.Y.Z-test  -> publié sur le canal « test » (pré-release GitHub)
#   vX.Y.Z       -> publié sur le canal « stable »
# Voir PUBLIER.md. Aucun jeton n'est écrit dans le dépôt : GITHUB_TOKEN est fourni par GitHub Actions.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # nécessaire pour créer la Release et y déposer les fichiers

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Le tag doit être X.Y.Z ou X.Y.Z-test ET sa version doit être égale à <Version> du csproj
      - name: Contrôler le tag, la version et le canal
        id: infos
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-test ]]; then
            CANAL="test"; BASE="${VERSION%-test}"; PRE="--pre"
          else
            CANAL="stable"; BASE="$VERSION"; PRE=""
          fi
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Tag invalide::Le tag '$TAG' doit être de la forme vX.Y.Z (stable) ou vX.Y.Z-test (test)."
            exit 1
          fi
          CSPROJ=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Pharmacie2.csproj | head -n 1 | tr -d '\r ')
          if [ "$BASE" != "$CSPROJ" ]; then
            echo "::error title=Version différente::Le tag '$TAG' annonce la version $BASE mais Pharmacie2.csproj contient <Version>$CSPROJ</Version>. Corrigez le csproj, commitez, puis recréez le tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "canal=$CANAL" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"
          echo "Publication de la version $VERSION sur le canal $CANAL"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # 2. Tous les tests d'abord : au moindre échec, rien n'est publié
      - name: Isoler le dossier de données des tests
        shell: pwsh
        run: |
          echo "PHARMACIE2_DATA_DIR=$env:RUNNER_TEMP\pharmacie2-tests" >> $env:GITHUB_ENV
          echo "CAPTURES_DIR=$env:RUNNER_TEMP\captures-ecrans" >> $env:GITHUB_ENV
      - run: dotnet restore tests/Pharmacie2.Tests/Pharmacie2.Tests.csproj
      - run: dotnet build tests/Pharmacie2.Tests/Pharmacie2.Tests.csproj -c Release --no-restore
      - run: dotnet test tests/Pharmacie2.Tests/Pharmacie2.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # 3. Application autonome (.NET inclus : rien à installer chez le client)
      - name: Publier l'application
        run: dotnet publish Pharmacie2.csproj -c Release --self-contained -r win-x64 -o publish -p:Version=${{ steps.infos.outputs.version }}

      # 4. vpk : outil local du dépôt (.config/dotnet-tools.json), même version que le package Velopack de l'application
      - name: Installer vpk
        run: dotnet tool restore

      # 5. Release précédente du même canal : nécessaire pour fabriquer les paquets delta (mises à jour légères).
      #    Sans release précédente (première publication du canal), l'étape est sans effet.
      - name: Télécharger la release précédente du canal
        continue-on-error: true
        run: dotnet tool run vpk download github --repoUrl https://github.com/${{ github.repository }} --channel ${{ steps.infos.outputs.canal }} ${{ steps.infos.outputs.pre }} --outputDir Releases
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fabriquer les paquets (installateur, complet, delta)
        run: >
          dotnet tool run vpk pack
          --packId LIGUAPHARME
          --packVersion ${{ steps.infos.outputs.version }}
          --packDir publish
          --mainExe Pharmacie2.exe
          --runtime win-x64
          --channel ${{ steps.infos.outputs.canal }}
          --packTitle LIGUAPHARME
          --icon resources/pharmacie_icon.ico
          --outputDir Releases

      # 6. Publication dans les Releases GitHub (aucun jeton dans le code : GITHUB_TOKEN du workflow)
      - name: Publier la Release
        run: >
          dotnet tool run vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --channel ${{ steps.infos.outputs.canal }}
          ${{ steps.infos.outputs.pre }}
          --publish
          --tag v${{ steps.infos.outputs.version }}
          --releaseName "LIGUAPHARME ${{ steps.infos.outputs.version }}"
          --outputDir Releases
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
